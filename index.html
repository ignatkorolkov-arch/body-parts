<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Части тела — English</title>
<style>
    ::-webkit-scrollbar { width: 0; height: 0; display: none; }
    * { scrollbar-width: none; -ms-overflow-style: none; -webkit-tap-highlight-color: transparent; }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --bg-main: #000;
        --bg-blob1: rgba(120, 130, 180, 0.35);
        --bg-blob2: rgba(180, 130, 150, 0.25);
        --bg-blob3: rgba(140, 160, 200, 0.25);
        --text-main: #fff;
        --text-dim: rgba(255, 255, 255, 0.5);
        --text-soft: rgba(255, 255, 255, 0.35);
        --glass-bg: rgba(255, 255, 255, 0.06);
        --glass-bg-hover: rgba(255, 255, 255, 0.1);
        --glass-border: rgba(255, 255, 255, 0.12);
        --glass-border-hover: rgba(255, 255, 255, 0.22);
        --glass-inset: rgba(255, 255, 255, 0.18);
        --glass-inset-hover: rgba(255, 255, 255, 0.3);
        --shadow: rgba(0, 0, 0, 0.5);
        --accent: #fff;
        --accent-text: #000;
        --glow: rgba(255, 255, 255, 0.08);
    }

    body.light {
        --bg-main: #f7f1e6;
        --bg-blob1: rgba(220, 200, 170, 0.5);
        --bg-blob2: rgba(240, 220, 190, 0.45);
        --bg-blob3: rgba(200, 190, 170, 0.4);
        --text-main: #4a3f2f;
        --text-dim: rgba(74, 63, 47, 0.6);
        --text-soft: rgba(74, 63, 47, 0.4);
        --glass-bg: rgba(255, 255, 255, 0.55);
        --glass-bg-hover: rgba(255, 255, 255, 0.7);
        --glass-border: rgba(160, 140, 110, 0.2);
        --glass-border-hover: rgba(160, 140, 110, 0.35);
        --glass-inset: rgba(255, 255, 255, 0.8);
        --glass-inset-hover: rgba(255, 255, 255, 0.95);
        --shadow: rgba(160, 140, 110, 0.2);
        --accent: #4a3f2f;
        --accent-text: #f7f1e6;
        --glow: rgba(160, 140, 110, 0.1);
    }

    body {
        font-family: -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif;
        background: var(--bg-main);
        color: var(--text-main);
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
        transition: background 0.5s ease, color 0.5s ease;
    }

    body::before {
        content: "";
        position: fixed;
        inset: -20%;
        background:
            radial-gradient(circle at 20% 20%, var(--bg-blob1) 0%, transparent 45%),
            radial-gradient(circle at 80% 70%, var(--bg-blob2) 0%, transparent 45%),
            radial-gradient(circle at 50% 90%, var(--bg-blob3) 0%, transparent 45%);
        filter: blur(70px);
        opacity: 0.8;
        animation: floatBg 30s ease-in-out infinite;
        z-index: 0;
        pointer-events: none;
        transition: background 0.5s ease;
    }

    @keyframes floatBg {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33%      { transform: translate(3%, -2%) scale(1.05); }
        66%      { transform: translate(-2%, 3%) scale(0.97); }
    }

    .app {
        position: relative;
        z-index: 1;
        max-width: 700px;
        margin: 0 auto;
        padding: 20px 16px 40px;
    }

    .glass {
        background: var(--glass-bg);
        backdrop-filter: blur(20px) saturate(140%);
        -webkit-backdrop-filter: blur(20px) saturate(140%);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        box-shadow:
            0 8px 32px var(--shadow),
            inset 0 1px 0 var(--glass-inset);
        position: relative;
        overflow: hidden;
        transition: all 0.5s ease;
    }

    .glass::before {
        content: "";
        position: absolute;
        top: 0; left: -50%;
        width: 200%; height: 100%;
        background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, 0.12) 50%, transparent 60%);
        animation: shine 6s ease-in-out infinite;
        pointer-events: none;
    }

    @keyframes shine {
        0%, 100% { transform: translateX(-40%); }
        50%      { transform: translateX(40%); }
    }

    .header {
        text-align: center;
        padding: 28px 18px 24px;
        margin-bottom: 16px;
        position: relative;
    }

    .header h1 {
        font-size: 26px;
        font-weight: 700;
        color: var(--text-main);
        letter-spacing: -0.5px;
        position: relative;
        z-index: 2;
        transition: color 0.5s ease;
    }

    .header p {
        font-size: 11px;
        color: var(--text-dim);
        margin-top: 6px;
        letter-spacing: 3px;
        text-transform: uppercase;
        position: relative;
        z-index: 2;
        transition: color 0.5s ease;
    }

    .theme-btn {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        color: var(--text-main);
        font-size: 20px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 3;
        box-shadow:
            inset 0 1px 0 var(--glass-inset),
            0 4px 12px var(--shadow);
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .theme-btn:active {
        transform: scale(0.92);
    }

    .tabs {
        display: flex;
        gap: 4px;
        padding: 5px;
        margin-bottom: 16px;
    }

    .tab {
        flex: 1;
        background: none;
        border: none;
        padding: 13px 6px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text-dim);
        cursor: pointer;
        font-family: inherit;
        border-radius: 18px;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
        z-index: 2;
    }

    .tab.active {
        background: var(--glass-bg-hover);
        color: var(--text-main);
        box-shadow:
            inset 0 1px 0 var(--glass-inset-hover),
            0 4px 16px var(--shadow);
    }

    .mode { display: none; }
    .mode.active { display: block; }

    .search-wrap { padding: 8px; }

    .search-box {
        width: 100%;
        padding: 14px 18px;
        font-size: 15px;
        font-family: inherit;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 18px;
        color: var(--text-main);
        outline: none;
        transition: all 0.3s ease;
        position: relative;
        z-index: 2;
    }

    .search-box::placeholder { color: var(--text-soft); }

    .search-box:focus {
        border-color: var(--glass-border-hover);
        background: var(--glass-bg-hover);
        box-shadow: 0 0 0 4px var(--glow);
    }

    .word-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 15px 18px;
        background: var(--glass-bg);
        backdrop-filter: blur(20px) saturate(140%);
        -webkit-backdrop-filter: blur(20px) saturate(140%);
        border: 1px solid var(--glass-border);
        border-radius: 18px;
        margin-bottom: 8px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow:
            inset 0 1px 0 var(--glass-inset),
            0 4px 16px var(--shadow);
    }

    .word-item:active,
    .word-item.playing {
        background: var(--glass-bg-hover);
        transform: scale(0.98);
        border-color: var(--glass-border-hover);
    }

    .word-info { flex: 1; min-width: 0; position: relative; z-index: 2; }

    .word-en {
        font-size: 17px;
        font-weight: 700;
        color: var(--text-main);
        margin-bottom: 4px;
    }

    .word-tr {
        font-size: 12.5px;
        color: var(--text-dim);
        font-weight: 500;
        margin-bottom: 2px;
    }

    .word-ru {
        font-size: 13.5px;
        color: var(--text-soft);
    }

    .play-icon {
        font-size: 18px;
        flex-shrink: 0;
        opacity: 0.6;
    }

    .listen-block {
        text-align: center;
        padding: 32px 20px;
    }

    .listen-instruction {
        font-size: 13px;
        color: var(--text-dim);
        margin-bottom: 22px;
        position: relative;
        z-index: 2;
    }

    .big-speaker {
        width: 130px;
        height: 130px;
        border-radius: 50%;
        background: var(--glass-bg);
        backdrop-filter: blur(20px) saturate(140%);
        border: 1px solid var(--glass-border);
        color: var(--text-main);
        font-size: 50px;
        cursor: pointer;
        box-shadow:
            inset 0 1px 0 var(--glass-inset),
            0 12px 40px var(--shadow);
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
        z-index: 2;
    }

    .big-speaker:active { transform: scale(0.95); }

    .replay-hint {
        font-size: 11px;
        color: var(--text-soft);
        margin-top: 18px;
        position: relative;
        z-index: 2;
    }

    .options {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .option {
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: 18px;
        padding: 17px 22px;
        text-align: left;
        cursor: pointer;
        color: var(--text-main);
        font-family: inherit;
        transition: all 0.3s ease;
        box-shadow: inset 0 1px 0 var(--glass-inset);
    }

    .option:active { background: var(--glass-bg-hover); transform: scale(0.98); }

    .opt-en { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .opt-ru { font-size: 12.5px; color: var(--text-dim); }

    .option.correct {
        background: var(--glass-bg-hover);
        border-color: var(--glass-border-hover);
    }

    .option.wrong { opacity: 0.4; }

    .stats {
        display: flex;
        justify-content: space-around;
        padding: 16px;
        margin-top: 12px;
    }

    .stat-box { text-align: center; }

    .stat-label {
        font-size: 10px;
        color: var(--text-soft);
        text-transform: uppercase;
        letter-spacing: 1.5px;
        font-weight: 600;
        margin-bottom: 6px;
    }

    .stat-num { font-size: 22px; font-weight: 800; color: var(--text-main); }

    .translate-block {
        text-align: center;
        padding: 28px 22px;
    }

    .translate-label {
        font-size: 11px;
        color: var(--text-soft);
        margin-bottom: 12px;
        letter-spacing: 2px;
        text-transform: uppercase;
        position: relative;
        z-index: 2;
    }

    .translate-word {
        font-size: 36px;
        font-weight: 800;
        color: var(--text-main);
        margin-bottom: 20px;
        position: relative;
        z-index: 2;
    }

    .translate-input {
        width: 100%;
        padding: 15px 20px;
        font-size: 16px;
        font-family: inherit;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 18px;
        color: var(--text-main);
        outline: none;
        margin-bottom: 10px;
        position: relative;
        z-index: 2;
    }

    .translate-input::placeholder { color: var(--text-soft); }

    .btn-check {
        width: 100%;
        padding: 15px;
        font-size: 15px;
        font-weight: 700;
        color: var(--accent-text);
        background: var(--accent);
        border: 1px solid var(--glass-border);
        border-radius: 18px;
        cursor: pointer;
        font-family: inherit;
        box-shadow: 0 8px 25px var(--shadow);
        transition: all 0.3s ease;
        position: relative;
        z-index: 2;
    }

    .btn-check:active { transform: scale(0.97); }

    .translate-result {
        font-size: 14px;
        margin-top: 16px;
        min-height: 22px;
        font-weight: 600;
        color: var(--text-dim);
    }

    .translate-result.correct { color: var(--text-main); }
    .translate-result.wrong { color: var(--text-soft); }

    .speak-word-btn {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 14px;
        padding: 10px 18px;
        font-size: 15px;
        cursor: pointer;
        color: var(--text-main);
        font-family: inherit;
        margin-bottom: 14px;
        position: relative;
        z-index: 2;
    }

    .voice-warning {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 14px;
        padding: 13px 18px;
        font-size: 13px;
        color: var(--text-dim);
        margin-bottom: 12px;
        display: none;
    }

    .voice-warning.show { display: block; }

    @media (max-width: 480px) {
        .app { padding: 14px 12px 30px; }
        .header { padding: 24px 16px 20px; }
        .header h1 { font-size: 22px; }
        .theme-btn { width: 38px; height: 38px; font-size: 18px; top: 12px; right: 12px; }
        .tab { font-size: 11.5px; padding: 11px 3px; }
        .big-speaker { width: 110px; height: 110px; font-size: 44px; }
        .translate-word { font-size: 30px; }
    }
</style>
</head>
<body>

<div class="app">
    <div class="header glass">
        <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Сменить тему">🌙</button>
        <h1>Части тела</h1>
        <p>English · pronunciation</p>
    </div>

    <div class="voice-warning glass" id="voiceWarning">
        ⚠️ Нет английского голоса. Установи English (US) в настройках системы.
    </div>

    <div class="tabs glass">
        <button class="tab active" onclick="switchMode('learn', this)">Учить</button>
        <button class="tab" onclick="switchMode('listen', this)">Слушать</button>
        <button class="tab" onclick="switchMode('translate', this)">Перевести</button>
    </div>

    <div id="learnMode" class="mode active">
        <div class="glass search-wrap">
            <input type="text" class="search-box" id="searchBox" placeholder="Поиск..." oninput="filterWords()">
        </div>
        <div id="wordList"></div>
    </div>

    <div id="listenMode" class="mode">
        <div class="glass listen-block">
            <div class="listen-instruction">Послушай и выбери перевод</div>
            <button class="big-speaker" id="bigSpeaker" onclick="playCurrent()">🔊</button>
            <div class="replay-hint">Нажми ещё раз, чтобы повторить</div>
        </div>
        <div class="options" id="options"></div>
        <div class="stats glass">
            <div class="stat-box">
                <div class="stat-label">Верно</div>
                <div class="stat-num" id="lCorrect">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Ошибок</div>
                <div class="stat-num" id="lWrong">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Всего</div>
                <div class="stat-num" id="lTotal">0</div>
            </div>
        </div>
    </div>

    <div id="translateMode" class="mode">
        <div class="glass translate-block">
            <div class="translate-label">Переведи слово</div>
            <div class="translate-word" id="trWord">Head</div>
            <button class="speak-word-btn" onclick="speakWord()">🔊 Послушать</button>
            <input type="text" class="translate-input" id="trInput" placeholder="Перевод на русский..." autocomplete="off">
            <button class="btn-check" onclick="checkTr()">Проверить</button>
            <div class="translate-result" id="trResult"></div>
        </div>
    </div>
</div>

<script>
    function toggleTheme() {
        document.body.classList.toggle('light');
        const isLight = document.body.classList.contains('light');
        document.getElementById('themeBtn').textContent = isLight ? '☀️' : '🌙';
        localStorage.setItem('bodyparts_theme', isLight ? 'light' : 'dark');
    }

    (function() {
        const saved = localStorage.getItem('bodyparts_theme');
        if (saved === 'light') {
            document.body.classList.add('light');
            document.getElementById('themeBtn').textContent = '☀️';
        }
    })();

    const words = [
        { en: 'Head', tr: '[hɛd]', ru: 'голова' },
        { en: 'Shoulder', tr: '[ˈʃoʊldər]', ru: 'плечо' },
        { en: 'Neck', tr: '[nɛk]', ru: 'шея' },
        { en: 'Chest', tr: '[tʃɛst]', ru: 'грудь' },
        { en: 'Finger', tr: '[ˈfɪŋɡər]', ru: 'палец руки' },
        { en: 'Elbow', tr: '[ˈɛlboʊ]', ru: 'локоть' },
        { en: 'Thumb', tr: '[θʌm]', ru: 'большой палец' },
        { en: 'Wrist', tr: '[rɪst]', ru: 'запястье' },
        { en: 'Hip', tr: '[hɪp]', ru: 'бедро сбоку' },
        { en: 'Breast', tr: '[brɛst]', ru: 'грудь' },
        { en: 'Belly', tr: '[ˈbɛli]', ru: 'живот' },
        { en: 'Thigh', tr: '[θaɪ]', ru: 'бедро' },
        { en: 'Knee', tr: '[niː]', ru: 'колено' },
        { en: 'Leg', tr: '[lɛɡ]', ru: 'нога голень' },
        { en: 'Toe', tr: '[toʊ]', ru: 'палец ноги' },
        { en: 'Calf', tr: '[kæf]', ru: 'икра' },
        { en: 'Ankle', tr: '[ˈæŋkl]', ru: 'лодыжка' },
        { en: 'Foot', tr: '[fʊt]', ru: 'ступня' },
        { en: 'Bottom', tr: '[ˈbɒtəm]', ru: 'попа' },
        { en: 'Face', tr: '[feɪs]', ru: 'лицо' },
        { en: 'Forearm', tr: '[ˈfɔːrɑːrm]', ru: 'предплечье' },
        { en: 'Arm', tr: '[ɑːrm]', ru: 'рука целиком' },
        { en: 'Upper arm', tr: '[ˈʌpər ɑːrm]', ru: 'верх руки' },
        { en: 'Nail', tr: '[neɪl]', ru: 'ноготь' },
        { en: 'Side', tr: '[saɪd]', ru: 'бок' },
        { en: 'Buttocks', tr: '[ˈbʌtəks]', ru: 'ягодицы' },
        { en: 'Groin', tr: '[ɡrɔɪn]', ru: 'пах' },
        { en: 'Armpit', tr: '[ˈɑːrmpɪt]', ru: 'подмышка' },
        { en: 'Heel', tr: '[hiːl]', ru: 'пятка' },
        { en: 'Waist', tr: '[weɪst]', ru: 'талия' },
        { en: 'Chin', tr: '[tʃɪn]', ru: 'подбородок' },
        { en: 'Sole', tr: '[soʊl]', ru: 'подошва' }
    ];

    let englishVoice = null;

    function pickEnglishVoice() {
        const voices = window.speechSynthesis.getVoices();
        if (!voices.length) return null;
        const priority = ['Google US English', 'Samantha', 'Microsoft Zira', 'Microsoft Aria', 'Alex', 'Daniel', 'Karen'];
        for (const name of priority) {
            const v = voices.find(voice => voice.name.includes(name));
            if (v) return v;
        }
        return voices.find(v => v.lang === 'en-US') || voices.find(v => v.lang === 'en-GB') || voices.find(v => v.lang.toLowerCase().startsWith('en'));
    }

    function loadVoices() {
        const voices = window.speechSynthesis.getVoices();
        if (!voices.length) return;
        englishVoice = pickEnglishVoice();
        const w = document.getElementById('voiceWarning');
        if (!englishVoice) w.classList.add('show');
        else w.classList.remove('show');
    }

    if ('speechSynthesis' in window) {
        loadVoices();
        window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function speak(text) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        if (!englishVoice) englishVoice = pickEnglishVoice();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = 0.8;
        u.pitch = 1.0;
        u.volume = 1.0;
        if (englishVoice) u.voice = englishVoice;
        window.speechSynthesis.speak(u);
    }

    function switchMode(mode, btn) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.mode').forEach(m => m.classList.remove('active'));
        if (mode === 'learn') document.getElementById('learnMode').classList.add('active');
        else if (mode === 'listen') { document.getElementById('listenMode').classList.add('active'); newQuestion(); }
        else if (mode === 'translate') { document.getElementById('translateMode').classList.add('active'); newTranslate(); }
    }

    function buildList() {
        const list = document.getElementById('wordList');
        list.innerHTML = '';
        words.forEach(w => {
            const item = document.createElement('div');
            item.className = 'word-item';
            item.dataset.search = (w.en + ' ' + w.ru).toLowerCase();
            item.innerHTML = `
                <div class="word-info">
                    <div class="word-en">${w.en}</div>
                    <div class="word-tr">${w.tr}</div>
                    <div class="word-ru">${w.ru}</div>
                </div>
                <div class="play-icon">🔊</div>
            `;
            item.onclick = () => {
                speak(w.en);
                item.classList.add('playing');
                setTimeout(() => item.classList.remove('playing'), 1500);
            };
            list.appendChild(item);
        });
    }

    function filterWords() {
        const q = document.getElementById('searchBox').value.toLowerCase();
        document.querySelectorAll('.word-item').forEach(item => {
            item.style.display = item.dataset.search.includes(q) ? 'flex' : 'none';
        });
    }

    let current = null, lCorrect = 0, lWrong = 0, lTotal = 0;

    function newQuestion() {
        const correct = words[Math.floor(Math.random() * words.length)];
        current = correct;
        const wrongs = [];
        while (wrongs.length < 3) {
            const w = words[Math.floor(Math.random() * words.length)];
            if (w.en !== correct.en && !wrongs.find(x => x.en === w.en)) wrongs.push(w);
        }
        const opts = [correct, ...wrongs].sort(() => Math.random() - 0.5);
        const box = document.getElementById('options');
        box.innerHTML = '';
        opts.forEach(o => {
            const b = document.createElement('button');
            b.className = 'option';
            b.innerHTML = `<div class="opt-en">${o.en}</div><div class="opt-ru">${o.ru}</div>`;
            b.onclick = () => checkAnswer(b, o);
            box.appendChild(b);
        });
        setTimeout(playCurrent, 500);
    }

    function playCurrent() {
        if (!current) return;
        const sp = document.getElementById('bigSpeaker');
        sp.classList.add('playing');
        speak(current.en);
        setTimeout(() => sp.classList.remove('playing'), 1500);
    }

    function checkAnswer(btn, o) {
        lTotal++;
        document.getElementById('lTotal').textContent = lTotal;
        if (o.en === current.en) {
            btn.classList.add('correct');
            lCorrect++;
            document.getElementById('lCorrect').textContent = lCorrect;
            setTimeout(newQuestion, 1400);
        } else {
            btn.classList.add('wrong');
            lWrong++;
            document.getElementById('lWrong').textContent = lWrong;
            setTimeout(() => btn.classList.remove('wrong'), 700);
        }
    }

    let trCurrent = null;

    function newTranslate() {
        trCurrent = words[Math.floor(Math.random() * words.length)];
        document.getElementById('trWord').textContent = trCurrent.en;
        document.getElementById('trInput').value = '';
        document.getElementById('trResult').textContent = '';
        document.getElementById('trResult').className = 'translate-result';
    }

    function speakWord() { if (trCurrent) speak(trCurrent.en); }

    function checkTr() {
        const inp = document.getElementById('trInput').value.trim().toLowerCase();
        const res = document.getElementById('trResult');
        const correct = trCurrent.ru.toLowerCase();
        if (inp === correct || (correct.includes(inp) && inp.length > 2)) {
            res.textContent = '✓ Верно! ' + trCurrent.en + ' — ' + trCurrent.ru;
            res.className = 'translate-result correct';
            speak(trCurrent.en);
            setTimeout(newTranslate, 1800);
        } else {
            res.textContent = '✗ Правильно: ' + trCurrent.ru;
            res.className = 'translate-result wrong';
        }
    }

    document.getElementById('trInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') checkTr();
    });

    buildList();
    setTimeout(loadVoices, 500);
    setTimeout(loadVoices, 1500);
</script>

</body>
</html>
